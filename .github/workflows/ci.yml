name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that is still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        # No real tokens needed: tests/__init__.py sets placeholders and every
        # external call is faked.
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  image:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t nexus .

      - name: Boot it with placeholder tokens
        # bot.py must get as far as its first startup check and stop cleanly
        # there. That proves the interpreter, every dependency, config loading
        # and the network layer all work inside the image -- everything except
        # the real APIs. Exit 1 with "Todoist check failed" is the expected
        # result; an import error, a crash or a hang fails the job.
        run: |
          set +e
          output=$(timeout 120 docker run --rm \
            -e PERSONAL_ACCESS_TOKEN_CLAUDE=placeholder \
            -e API_TOKEN_TODOIST=placeholder \
            -e API_TOKEN_TELEGRAM=placeholder \
            -e NEXUS_TIMEZONE=America/Toronto \
            nexus 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::expected exit status 1 from the startup check, got $status"
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q "Todoist check failed"; then
            echo "::error::expected the Todoist startup check to be what stopped it"
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q "Memory: /data/nexus.db"; then
            echo "::error::the memory database did not open at /data/nexus.db inside the image"
            exit 1
          fi
          echo "OK: the image boots and stops at the Todoist check, as it must without real tokens"
